sample:
  description: Bluetooth LE Power Profiling (dev sample)
  name: Bluetooth LE Power Profiling Dev

common:
  sysbuild: true
  tags:
    - bluetooth
    - sysbuild
    - ci_samples_bluetooth
  build_only: true
  platform_allow:
    - nrf5340dk/nrf5340/cpuapp

tests:
  sample.bluetooth.peripheral_power_profiling_dev:
    integration_platforms:
      - nrf5340dk/nrf5340/cpuapp
    platform_allow:
      - nrf5340dk/nrf5340/cpuapp

  sample.bluetooth.peripheral_power_profiling_dev.ble_disabled:
    integration_platforms:
      - nrf5340dk/nrf5340/cpuapp
    platform_allow:
      - nrf5340dk/nrf5340/cpuapp
    extra_args:
      - FILE_SUFFIX=ble_disabled
      - peripheral_power_profiling_dev_OVERLAY_CONFIG=overlay-ble_disabled.conf
