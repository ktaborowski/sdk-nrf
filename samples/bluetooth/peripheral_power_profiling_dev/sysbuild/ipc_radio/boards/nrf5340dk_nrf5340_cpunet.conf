# Netcore (ipc_radio) low-power configuration for nRF5340 DK.
# Reduces RAM usage and disables debug/assert to minimize netcore power.
#

# Reduce stack sizes (netcore only runs BLE controller + IPC)
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=512
CONFIG_MAIN_STACK_SIZE=1024

# Disable assert to reduce code size and avoid assert-handler overhead
CONFIG_ASSERT=n

# Minimize BLE controller assert handler when assert is off
CONFIG_BT_CTLR_ASSERT_HANDLER=n
