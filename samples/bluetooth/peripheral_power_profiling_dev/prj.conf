# BLE and DK options below apply when CONFIG_APP_POWER_PROFILING_BLE=y.
# For BLE disabled use overlay-ble_disabled.conf (sets APP_POWER_PROFILING_BLE=n, BT=n, DK_LIBRARY=n).

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Nordic_Power_Profiling"
CONFIG_BT_EXT_ADV=y

CONFIG_DK_LIBRARY=y

CONFIG_POWEROFF=y

CONFIG_BT_ASSERT=n
CONFIG_ASSERT_VERBOSE=n

CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
